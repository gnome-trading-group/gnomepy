# Sample backtest config consumed by `gnomepy backtest --config ...`.
strategy:
  class_name: "gnomepy_research.strategies.momentum:MomentumTaker"
  args:
    exchange_id: 1
    security_id: 1
    size: 1000
    max_position: 500000
    threshold_bps: 2.0
#    ewma_alpha: [0.90, 0.95, 0.99]
    ewma_alpha: 0.9
    warmup_ticks: 100

start_date: "2026-01-24T00:00:00"
end_date: "2026-01-25T00:00:00"

listings:
  - listing_id: 1
    profile: default

profiles:
  default:
    fee_model:
      type: static
      taker_fee: 0.0005
      maker_fee: 0.0002
    # Market data reaches the strategy at the receive time recorded with each record (about 50ms after the venue
    # event on Polymarket and Kalshi). Set a model here only to test fresher or staler data than was recorded.
    # market_data_latency:
    #   type: static
    #   latency_nanos: 1000000
    # Our order connection, each way: orders out and reports back. Omitted, it is a 5ms floor, 12ms median and
    # 200ms p99 log-normal.
    network_latency:
      type: static
      latency_nanos: 5000000
    # network_latency:
    #   type: lognormal
    #   floor_nanos: 5000000
    #   median_nanos: 12000000
    #   p99_nanos: 200000000
    order_processing_latency:
      type: static
      latency_nanos: 1000000
    queue_model:
      type: risk_averse

# Optional: number of book depth levels to record (1 = BBO only, max 10).
# record_depth: 3

# Optional: the strategy id the run trades as (default 0). Needed for risk.from_registry.
# strategy_id: 12

# Optional: OMS risk policies. Money limits are in price units (1e9 = $1).
# Omitted or 0 strategy_id/listing_id means every strategy/listing.
# risk:
#   from_registry: true   # also load strategy_id's live policies (no kill switches)
#   policies:
#     - type: MAX_NOTIONAL
#       params: { maxNotionalValue: 1000000000000000 }  # $1,000,000
#     - type: MAX_OPEN_ORDERS
#       listing_id: 7122
#       params: { maxOpenOrders: 3 }
