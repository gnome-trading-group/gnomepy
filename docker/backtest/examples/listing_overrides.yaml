# How one listing can simulate differently from the rest of its exchange.
#
# Every listing simulates with its exchange's simulation parameters, recorded in the registry (controller →
# Security Master → Simulation), and pays its venue's fees from the registry's fee schedules. A config overrides
# blocks of those only for what the experiment is about, in layers, each replacing whole blocks of the one below:
#   1. the exchange's registry parameters
#   2. `exchanges.<CODE>`: every listing on that exchange
#   3. `listings[].overrides`: one listing
#
# Here: what happens to the arb when one Polymarket leg is slow to take? Kalshi's queue is optimistic for both its
# listings (layer 2), and only the Polymarket NO leg, 229126, waits 3s before a take reaches the book (layer 3).
# 229125 simulates exactly as Polymarket International is recorded.

strategy:
  class_name: "gnomepy_research.strategies.equivalent_event_arb:EquivalentEventArb"
  args:
    max_position: 100
    min_pure_arb_bps: 5.0
    taker_edge_threshold_bps: 99999
    processing_time_ns: 5000000
    allow_scaling: false
    imbalance_timeout_ns: 300000000000
    event_ids: [46259, 48600]

start_date: "2026-08-24T00:23:00"
end_date: "2026-08-24T02:12:00"
record_depth: 10

exchanges:
  KALSHI:
    queue_model: { type: optimistic }

listings:
  - listing_id: 217772    # Kalshi
  - listing_id: 217773    # Kalshi
  - listing_id: 229125    # Polymarket International, YES
  - listing_id: 229126    # Polymarket International, NO
    overrides:
      # A block is replaced whole, so it names its model and every field of it.
      order_processing_latency: { type: maker_taker, base_nanos: 5000000, taker_delay_nanos: 3000000000, maker_delay_nanos: 0 }

# The time the run reads the registry's parameters and fees as known at. Left out, it is when the run starts; the
# run's metadata records it, along with what each listing resolved to.
# simulation_as_of: "2026-10-16T00:00:00Z"
